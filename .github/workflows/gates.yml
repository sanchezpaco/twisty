# The three gates of CLAUDE.md on every push to main and every pull request. CI has no data (app/public/data and data/
# are git-ignored), so the tests that need it skip; the bench stays a local job. One job: the repository is private and
# its Actions minutes count.
name: gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          pip install -e '.[dev]'
          pytest -q
      - name: App install
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: App tests
        working-directory: app
        run: npm test
      - name: Type checks
        working-directory: app
        run: npm run check
