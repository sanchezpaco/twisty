<!doctype html>
<!-- Renders icon.svg at 512x512 for Google Play. -->
<html>
<head><meta charset="utf-8"><style>html, body { margin: 0; background: #0b0e14; } img { display: block; }</style></head>
<body>
<img src="icon.svg" width="512" height="512" alt="">
<script type="module">
  await document.querySelector('img').decode()
  document.body.dataset.ready = '1'
</script>
</body>
</html>
